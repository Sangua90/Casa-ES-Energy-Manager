name: Energy Meter Engine
on:
  push:
  pull_request:
permissions: {}
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -p test_energy_engine.py
      - run: python -m unittest discover -s tests -p test_house_climate.py
      - run: python -m unittest discover -s tests -p test_engine_bridge.py
      - run: python -m unittest discover -s tests -p test_climate_predictive.py
      - run: docker build -t energy-meter-engine:test energy_meter_engine
